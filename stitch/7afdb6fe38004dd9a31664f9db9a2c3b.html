<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Page - Canvas Start Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <!-- Root Surface: SURF_PLAY_PAGE -->
  <div data-surface-id="SURF_PLAY_PAGE" class="flex-1 flex flex-col w-full min-h-screen">
    
    <!-- Top Navigation Chrome (Non-actionable decorative header) -->
    <header class="w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <span class="text-white font-black text-lg tracking-wider">C</span>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight">Canvas Arcade</h1>
          <p class="text-xs text-slate-400">Retro WebGL Action</p>
        </div>
      </div>

      <!-- Live Dashboard Status Indicators -->
      <div class="flex items-center gap-6">
        <!-- High Score Status Observable -->
        <div class="flex flex-col items-end">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">High Score</span>
          <div role="status" aria-label="High score" class="text-xl font-mono font-bold text-amber-400">
            <!-- Initial state before action is empty/null, styled placeholder -->
          </div>
        </div>

        <!-- Game Status Observable -->
        <div class="flex flex-col items-end pl-6 border-l border-slate-800">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">System</span>
          <div role="status" aria-label="Game status" class="text-sm font-medium text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Ready to Play
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace / Arena -->
    <main class="flex-1 flex flex-col items-center justify-center p-8 relative overflow-hidden">
      <!-- Glow ambient effects -->
      <div class="absolute w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-3xl pointer-events-none -top-20 -left-20"></div>
      <div class="absolute w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-3xl pointer-events-none -bottom-20 -right-20"></div>

      <div class="w-full max-w-4xl flex flex-col items-center gap-6 relative z-10">
        <!-- Contained Surface: SURF_GAME_CANVAS -->
        <div data-surface-id="SURF_GAME_CANVAS" class="w-full aspect-[16/9] bg-slate-900 rounded-2xl border-2 border-slate-800 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center group">
          <!-- Game Canvas Decorative Grid & Backing Elements -->
          <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-40 pointer-events-none"></div>

          <!-- Radar / Arena Target Motif -->
          <div class="w-64 h-64 rounded-full border border-indigo-500/20 flex items-center justify-center relative pointer-events-none">
            <div class="w-48 h-48 rounded-full border border-indigo-500/30 flex items-center justify-center">
              <div class="w-32 h-32 rounded-full border border-indigo-500/40 flex items-center justify-center">
                <div class="w-3 h-3 rounded-full bg-indigo-400 shadow-lg shadow-indigo-400"></div>
              </div>
            </div>
            <div class="absolute inset-x-0 h-px bg-indigo-500/20"></div>
            <div class="absolute inset-y-0 w-px bg-indigo-500/20"></div>
          </div>

          <!-- Canvas Overlay Message -->
          <div class="absolute bottom-6 text-center pointer-events-none">
            <p class="text-xs font-mono uppercase tracking-widest text-slate-500">HTML5 Canvas Ready / 1920x1080 Native Buffer</p>
          </div>
        </div>

        <!-- Controls Toolbar on Play Page -->
        <div class="w-full flex items-center justify-between px-4 py-3 bg-slate-900/60 rounded-xl border border-slate-800/80">
          <div class="flex items-center gap-4 text-xs text-slate-400">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-mono">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
              ROUTE: /play
            </span>
            <span>Desktop Canvas Engine v2.4</span>
          </div>

          <!-- Physical Control Slot: CSLOT_START_GAME_START_BUTTON -->
          <div>
            <button
              type="button"
              data-action="ACT_START_GAME"
              data-control-slot="CSLOT_START_GAME_START_BUTTON"
              class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold text-sm rounded-lg shadow-lg shadow-indigo-600/30 transition-all duration-150 flex items-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-950"
            >
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <span>Start Game</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Chrome (Non-actionable) -->
    <footer class="w-full border-t border-slate-800/80 py-4 px-8 text-center text-xs text-slate-500">
      <p>Setfarm Canvas Game System &copy; 2025. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
